pluginManagement {
    includeBuild(new File(
        ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"]
            .execute(null, rootDir).text.trim()
    ).getParentFile().toString())

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()

        // ✅ Include Notifee Maven repo here too
        maven { url "https://notifee-maven.s3.amazonaws.com/release" }

        // Optional: For other RN libraries
        maven { url "https://www.jitpack.io" }
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
        ex.autolinkLibrariesFromCommand()
    } else {
        def command = [
            'node',
            '--no-warnings',
            '--eval',
            'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
            'react-native-config',
            '--json',
            '--platform',
            'android'
        ].toList()
        ex.autolinkLibrariesFromCommand(command)
    }
}

rootProject.name = "rentongovehicle"

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        google()
        mavenCentral()

        // ✅ Local Notifee libs directory (must come before remote)
        maven {
            url(new File(
                ['node', '--print', "require.resolve('@notifee/react-native/package.json')"]
                    .execute(null, rootDir).text.trim(),
                "../android/libs"
            ))
        }

        // ✅ This is the key fix — Notifee's native Maven repo
        maven { url "https://notifee-maven.s3.amazonaws.com/release" }

        // Optional — for other RN libs
        maven { url "https://www.jitpack.io" }

        // React Native Android binaries
        maven {
            url(new File(
                ['node', '--print', "require.resolve('react-native/package.json')"]
                    .execute(null, rootDir).text.trim(),
                "../android"
            ))
        }

        // Android JSC from npm
        maven {
            url(new File(
                ['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"]
                    .execute(null, rootDir).text.trim(),
                "../dist"
            ))
        }
    }

    versionCatalogs {
        reactAndroidLibs {
            from(files(new File(
                ["node", "--print", "require.resolve('react-native/package.json')"]
                    .execute(null, rootDir).text.trim(),
                "../gradle/libs.versions.toml"
            )))
        }
    }
}

apply from: new File(
    ["node", "--print", "require.resolve('expo/package.json')"]
        .execute(null, rootDir).text.trim(),
    "../scripts/autolinking.gradle"
)

useExpoModules()

include(":app")

includeBuild(new File(
    ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"]
        .execute(null, rootDir).text.trim()
).getParentFile())