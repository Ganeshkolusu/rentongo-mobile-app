# Project-wide Gradle settings.

# =======================
# Gradle & JVM Settings
# =======================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=true -Dorg.gradle.configureondemand=true -Dkotlin.daemon.jvm.options=-Xmx4096m
org.gradle.parallel=true
android.overridePathCheck=true

# =======================
# AndroidX + Build Options
# =======================
android.useAndroidX=true
android.enableJetifier=true
android.enablePngCrunchInReleaseBuilds=true

# =======================
# React Native Architectures
# =======================
reactNativeArchitectures=arm64-v8a

# =======================
# React Native Feature Flags
# =======================
# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# =======================
# Expo Settings
# =======================
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
expo.useLegacyPackaging=false

# =======================
# 16KB Page Size Support (Android 15+)
# =======================
android.bundle.enableUncompressedNativeLibs=true
android.bundle.language.enableSplit=true
android.bundle.density.enableSplit=true
android.bundle.abi.enableSplit=true

# Enable ProGuard for release builds
android.enableProguardInReleaseBuilds=true

# =======================
# Developer Settings
# =======================
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# =======================
# Fixes for Windows + CMake + Reanimated
# =======================
# Fix CMake/Reanimated long path issue on Windows
# (prevents: mkdir(...) No such file or directory)
org.gradle.workers.max=2
android.native.buildOutput=verbose
REACT_NATIVE_DISABLE_WINDOWS_LONG_PATHS_WARNING=true

# =======================
# Notifee Repository Fix
# =======================
# Ensures Gradle finds Notifee Maven repo properly
mavenRepoUrl=https://notifee-maven.s3.amazonaws.com/release
MYAPP_UPLOAD_STORE_FILE=release-keystore.jks
MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=rentongo
MYAPP_UPLOAD_KEY_PASSWORD=rentongo
# Google Play requires targeting Android 16 (API 36) from 1 Nov 2026.
android.compileSdkVersion=36
android.targetSdkVersion=36
android.buildToolsVersion=36.0.0
# AGP 8.6 predates API 36; this silences its "unsupported compileSdk" check.
android.suppressUnsupportedCompileSdk=36
